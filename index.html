<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRIXO | Panel Detallado</title>
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --dark: #1e293b; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: #334155; }
        .container { width: 95%; max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        
        #app-content { display: none; }
        header { background: var(--dark); color: white; padding: 30px 0; margin-bottom: 30px; }
        
        .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .stat { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: center; }
        .stat b { display: block; font-size: 1.5rem; }

        .grid-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 14px; }
        button { cursor: pointer; font-weight: bold; border: none; background: var(--primary); color: white; }
        .btn-compra { background: var(--dark); }
        .btn-venta { background: var(--success); }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: #f8fafc; padding: 12px; text-align: left; color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 12px; border-top: 1px solid #f1f5f9; }
        
        .row-lote { background: #fefce8; font-weight: bold; border-left: 4px solid #f59e0b; }
        .row-venta { background: #ffffff; font-size: 0.9rem; }
        .indent { padding-left: 30px; color: #64748b; }
        
        @media (max-width: 768px) { .grid-forms, .resumen { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1>VRIXO</h1>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Contraseña">
            <button id="btn-entrar">Entrar</button>
        </div>
    </div>

    <div id="app-content">
        <header>
            <div class="container">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="margin:0">🚀 Vrixo Cloud</h2>
                    <div style="display:flex; gap:10px;">
                        <button onclick="location.reload()" style="width:auto; background:#475569; padding:8px 15px;">🔄 Refrescar</button>
                        <button id="btn-backup" style="width:auto; background:#0f766e; padding:8px 15px;">💾 Backup</button>
                        <button id="btn-restaurar" style="width:auto; background:#7c3aed; padding:8px 15px;">📥 Restaurar</button>
                        <button id="btn-salir" style="background:none; color:#94a3b8; width:auto; text-decoration:underline">Salir</button>
                    </div>
                </div>
                <div class="resumen">
                    <div class="stat"><span>Inversión</span><b id="t-gastos">0.00€</b></div>
                    <div class="stat"><span>Ventas</span><b id="t-ventas">0.00€</b></div>
                    <div class="stat"><span>Neto</span><b id="t-neto">0.00€</b></div>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="grid-forms">
                <section class="card">
                    <h3>📦 Registrar Compra</h3>
                    <input type="text" id="g-nom" placeholder="Nombre del Lote">
                    <input type="number" id="g-pre" placeholder="Precio Compra €">
                    <input type="number" id="g-env" placeholder="Gasto Envío €">
                    <button id="btn-add-compra" class="btn-compra">Guardar Lote</button>
                </section>
                <section class="card">
                    <h3>💰 Registrar Venta</h3>
                    <input type="text" id="v-nom" placeholder="Artículo vendido">
                    <input type="number" id="v-pre" placeholder="Precio Venta €">
                    <select id="v-vin"><option value="suelto">Venta Suelta (Sin lote)</option></select>
                    <button id="btn-add-venta" class="btn-venta">Guardar Venta</button>
                </section>
            </div>
            <section class="card" style="margin-bottom:20px;">
                <h3>🧾 Exportación Fiscal</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:10px; align-items:end;">
                    <div>
                        <label for="f-desde">Desde</label>
                        <input type="date" id="f-desde">
                    </div>
                    <div>
                        <label for="f-hasta">Hasta</label>
                        <input type="date" id="f-hasta">
                    </div>
                    <button id="btn-aplicar-filtro" style="width:auto; background:#334155; padding:11px 16px;">Aplicar rango</button>
                </div>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-top:10px;">
                    <button id="btn-exp-mov" style="background:#0f766e;">Exportar Movimientos CSV</button>
                    <button id="btn-exp-compras" style="background:#1d4ed8;">Exportar Compras CSV</button>
                    <button id="btn-exp-ventas" style="background:#059669;">Exportar Ventas CSV</button>
                    <button id="btn-exp-borrados" style="background:#7c2d12;">Exportar Borrados CSV</button>
                    <button id="btn-exp-json" style="background:#6d28d9;">Exportar JSON Fiscal</button>
                </div>
                <div id="fiscal-info" style="margin-top:10px; font-size:0.85rem; color:#475569;">Sin datos para exportar.</div>
            </section>

            <div style="overflow-x:auto; background:white; border-radius:15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Concepto / Detalle</th>
                            <th>Costo</th>
                            <th>Venta</th>
                            <th>Estado/Margen</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo"></tbody>
                </table>
            </div>
            <div style="height:50px"></div>
        </div>
    </div>
    <input id="backup-file" type="file" accept="application/json" style="display:none">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBphY_jaOOOVOzwzfoXE78_iDVOQYRhA2o",
            authDomain: "control-de-gastos-39154.firebaseapp.com",
            projectId: "control-de-gastos-39154",
            storageBucket: "control-de-gastos-39154.firebasestorage.app",
            messagingSenderId: "845236944662",
            appId: "1:845236944662:web:897201644eaf708afd5a37"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let userUID = null;
        let dataLocal = { compras: [], ventas: [] };
        let stopCompras = null;
        let stopVentas = null;

        // AUTH
        document.getElementById('btn-entrar').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Error: " + e.message));
        });
        document.getElementById('btn-salir').addEventListener('click', () => signOut(auth));
        document.getElementById('btn-backup').addEventListener('click', descargarBackup);
        document.getElementById('btn-restaurar').addEventListener('click', () => document.getElementById('backup-file').click());
        document.getElementById('btn-aplicar-filtro').addEventListener('click', actualizarResumenFiscal);
        document.getElementById('btn-exp-mov').addEventListener('click', exportarMovimientosCSV);
        document.getElementById('btn-exp-compras').addEventListener('click', exportarComprasCSV);
        document.getElementById('btn-exp-ventas').addEventListener('click', exportarVentasCSV);
        document.getElementById('btn-exp-json').addEventListener('click', exportarJSONFiscal);
        document.getElementById('btn-exp-borrados').addEventListener('click', exportarBorradosCSV);
        document.getElementById('backup-file').addEventListener('change', async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            await restaurarBackup(file);
            event.target.value = "";
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userUID = user.uid;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                iniciarSincro();
            } else {
                if (stopCompras) stopCompras();
                if (stopVentas) stopVentas();
                stopCompras = null;
                stopVentas = null;
                userUID = null;
                dataLocal = { compras: [], ventas: [] };
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-content').style.display = 'none';
                document.getElementById('fiscal-info').innerText = "Sin datos para exportar.";
            }
        });

        function iniciarSincro() {
            if (stopCompras) stopCompras();
            if (stopVentas) stopVentas();
            stopCompras = onSnapshot(query(collection(db, "compras"), where("uid", "==", userUID)), (s1) => {
                dataLocal.compras = s1.docs.map(d => ({ id: d.id, ...d.data() }));
                actualizarUI();
            });
            stopVentas = onSnapshot(query(collection(db, "ventas"), where("uid", "==", userUID)), (s2) => {
                dataLocal.ventas = s2.docs.map(d => ({ id: d.id, ...d.data() }));
                actualizarUI();
            });
        }

        document.getElementById('btn-add-compra').addEventListener('click', async () => {
            const nom = document.getElementById('g-nom').value;
            const total = (parseFloat(document.getElementById('g-pre').value) || 0) + (parseFloat(document.getElementById('g-env').value) || 0);
            if(!nom || total <= 0) return;
            await addDoc(collection(db, "compras"), { uid: userUID, nom, total, fecha: new Date().toLocaleDateString() });
            document.getElementById('g-nom').value = ""; document.getElementById('g-pre').value = ""; document.getElementById('g-env').value = "";
        });

        document.getElementById('btn-add-venta').addEventListener('click', async () => {
            const nom = document.getElementById('v-nom').value;
            const pre = parseFloat(document.getElementById('v-pre').value) || 0;
            const vin = document.getElementById('v-vin').value;
            if(!nom || pre <= 0) return;
            await addDoc(collection(db, "ventas"), { uid: userUID, nom, pre, vin, fecha: new Date().toLocaleDateString() });
            document.getElementById('v-nom').value = ""; document.getElementById('v-pre').value = "";
        });

        window.borrarReg = async (tipo, id) => {
            if (!confirm("¿Eliminar permanentemente?")) return;
            const origen = tipo === 'c' ? dataLocal.compras : dataLocal.ventas;
            const registro = origen.find(item => item.id === id);
            if (registro) {
                await addDoc(collection(db, "historial_borrados"), {
                    uid: userUID,
                    tipo,
                    originalId: id,
                    registro,
                    eliminadoEn: new Date().toISOString()
                });
            }
            await deleteDoc(doc(db, tipo === 'c' ? "compras" : "ventas", id));
        };

        function descargarBackup() {
            if (!userUID) return alert("Inicia sesión para exportar.");
            const payload = {
                version: 1,
                uid: userUID,
                fechaExportacion: new Date().toISOString(),
                compras: dataLocal.compras,
                ventas: dataLocal.ventas
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `vrixo-backup-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        async function restaurarBackup(file) {
            if (!userUID) return alert("Inicia sesión para restaurar.");
            let contenido;
            try {
                contenido = JSON.parse(await file.text());
            } catch {
                return alert("El archivo no es un JSON válido.");
            }

            const comprasBackup = Array.isArray(contenido.compras) ? contenido.compras : [];
            const ventasBackup = Array.isArray(contenido.ventas) ? contenido.ventas : [];
            if (comprasBackup.length === 0 && ventasBackup.length === 0) {
                return alert("El backup no contiene compras ni ventas.");
            }

            const [snapCompras, snapVentas] = await Promise.all([
                getDocs(query(collection(db, "compras"), where("uid", "==", userUID))),
                getDocs(query(collection(db, "ventas"), where("uid", "==", userUID)))
            ]);

            const comprasExistentes = new Set(snapCompras.docs.map(d => d.id));
            const ventasExistentes = new Set(snapVentas.docs.map(d => d.id));

            let batch = writeBatch(db);
            let operaciones = 0;
            let comprasImportadas = 0;
            let ventasImportadas = 0;

            const confirmarBatch = async () => {
                if (operaciones === 0) return;
                await batch.commit();
                batch = writeBatch(db);
                operaciones = 0;
            };

            for (const compra of comprasBackup) {
                if (!compra || !compra.id || comprasExistentes.has(compra.id)) continue;
                batch.set(doc(db, "compras", compra.id), {
                    uid: userUID,
                    nom: compra.nom || "Lote importado",
                    total: Number(compra.total) || 0,
                    fecha: compra.fecha || new Date().toLocaleDateString()
                }, { merge: true });
                comprasExistentes.add(compra.id);
                comprasImportadas += 1;
                operaciones += 1;
                if (operaciones >= 400) await confirmarBatch();
            }

            for (const venta of ventasBackup) {
                if (!venta || !venta.id || ventasExistentes.has(venta.id)) continue;
                batch.set(doc(db, "ventas", venta.id), {
                    uid: userUID,
                    nom: venta.nom || "Venta importada",
                    pre: Number(venta.pre) || 0,
                    vin: venta.vin || "suelto",
                    fecha: venta.fecha || new Date().toLocaleDateString()
                }, { merge: true });
                ventasExistentes.add(venta.id);
                ventasImportadas += 1;
                operaciones += 1;
                if (operaciones >= 400) await confirmarBatch();
            }

            await confirmarBatch();
            alert(`Restauración completada.\nCompras importadas: ${comprasImportadas}\nVentas importadas: ${ventasImportadas}`);
        }

        function parseFecha(valor) {
            if (!valor) return null;
            if (valor instanceof Date && !Number.isNaN(valor.getTime())) return valor;
            if (typeof valor !== "string") return null;
            const iso = new Date(valor);
            if (!Number.isNaN(iso.getTime()) && valor.includes("-")) return iso;
            if (valor.includes("/")) {
                const [d, m, y] = valor.split("/");
                const parsed = new Date(Number(y), Number(m) - 1, Number(d));
                if (!Number.isNaN(parsed.getTime())) return parsed;
            }
            return null;
        }

        function toInputDate(date) {
            const yyyy = date.getFullYear();
            const mm = `${date.getMonth() + 1}`.padStart(2, "0");
            const dd = `${date.getDate()}`.padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        function asegurarRangoFiscal() {
            const elDesde = document.getElementById('f-desde');
            const elHasta = document.getElementById('f-hasta');
            if (elDesde.value && elHasta.value) return;
            const fechas = [...dataLocal.compras.map(x => parseFecha(x.fecha)), ...dataLocal.ventas.map(x => parseFecha(x.fecha))]
                .filter(Boolean)
                .sort((a, b) => a - b);
            const hoy = new Date();
            elDesde.value = fechas.length ? toInputDate(fechas[0]) : toInputDate(new Date(hoy.getFullYear(), 0, 1));
            elHasta.value = fechas.length ? toInputDate(fechas[fechas.length - 1]) : toInputDate(hoy);
        }

        function obtenerRangoFiscal() {
            asegurarRangoFiscal();
            const desdeStr = document.getElementById('f-desde').value;
            const hastaStr = document.getElementById('f-hasta').value;
            const desde = desdeStr ? new Date(`${desdeStr}T00:00:00`) : null;
            const hasta = hastaStr ? new Date(`${hastaStr}T23:59:59`) : null;
            return { desde, hasta, desdeStr, hastaStr };
        }

        function estaEnRango(fecha, rango) {
            if (!fecha) return false;
            if (rango.desde && fecha < rango.desde) return false;
            if (rango.hasta && fecha > rango.hasta) return false;
            return true;
        }

        function formatImporte(valor) {
            return (Number(valor) || 0).toFixed(2);
        }

        function escaparCSV(valor) {
            const str = String(valor ?? "");
            if (str.includes('"') || str.includes(';') || str.includes('\n')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function descargarCSV(nombre, columnas, filas) {
            const contenido = [columnas.map(escaparCSV).join(";"), ...filas.map(fila => fila.map(escaparCSV).join(";"))].join("\n");
            const blob = new Blob(["\uFEFF" + contenido], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = nombre;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function obtenerMovimientosFiltrados() {
            const rango = obtenerRangoFiscal();
            const compras = dataLocal.compras.map(c => ({
                fecha: c.fecha || "",
                fechaObj: parseFecha(c.fecha),
                tipo: "COMPRA",
                concepto: c.nom || "",
                id: c.id,
                vinculo: "",
                importe: -Math.abs(Number(c.total) || 0)
            }));
            const ventas = dataLocal.ventas.map(v => ({
                fecha: v.fecha || "",
                fechaObj: parseFecha(v.fecha),
                tipo: "VENTA",
                concepto: v.nom || "",
                id: v.id,
                vinculo: v.vin || "suelto",
                importe: Math.abs(Number(v.pre) || 0)
            }));
            return [...compras, ...ventas]
                .filter(m => estaEnRango(m.fechaObj, rango))
                .sort((a, b) => (a.fechaObj?.getTime() || 0) - (b.fechaObj?.getTime() || 0));
        }

        function actualizarResumenFiscal() {
            const rango = obtenerRangoFiscal();
            const movimientos = obtenerMovimientosFiltrados();
            const totalCompras = movimientos.filter(m => m.tipo === "COMPRA").reduce((s, x) => s + Math.abs(x.importe), 0);
            const totalVentas = movimientos.filter(m => m.tipo === "VENTA").reduce((s, x) => s + x.importe, 0);
            const neto = totalVentas - totalCompras;
            document.getElementById('fiscal-info').innerText = `Rango ${rango.desdeStr || "-"} a ${rango.hastaStr || "-"} | Registros ${movimientos.length} | Compras ${formatImporte(totalCompras)}€ | Ventas ${formatImporte(totalVentas)}€ | Neto ${formatImporte(neto)}€`;
        }

        function exportarMovimientosCSV() {
            if (!userUID) return alert("Inicia sesión para exportar.");
            const filas = obtenerMovimientosFiltrados().map(m => [m.fecha, m.tipo, m.concepto, m.id, m.vinculo, formatImporte(m.importe)]);
            if (!filas.length) return alert("No hay movimientos en el rango indicado.");
            descargarCSV("vrixo-movimientos-fiscales.csv", ["fecha", "tipo", "concepto", "id", "vinculo", "importe"], filas);
        }

        function exportarComprasCSV() {
            if (!userUID) return alert("Inicia sesión para exportar.");
            const rango = obtenerRangoFiscal();
            const filas = dataLocal.compras
                .filter(c => estaEnRango(parseFecha(c.fecha), rango))
                .map(c => {
                    const recaudado = dataLocal.ventas.filter(v => v.vin === c.id).reduce((s, x) => s + (Number(x.pre) || 0), 0);
                    const total = Number(c.total) || 0;
                    return [c.fecha || "", c.id, c.nom || "", formatImporte(total), formatImporte(recaudado), formatImporte(recaudado - total)];
                });
            if (!filas.length) return alert("No hay compras en el rango indicado.");
            descargarCSV("vrixo-compras-fiscales.csv", ["fecha", "id", "lote", "coste_total", "recaudado", "margen"], filas);
        }

        function exportarVentasCSV() {
            if (!userUID) return alert("Inicia sesión para exportar.");
            const rango = obtenerRangoFiscal();
            const filas = dataLocal.ventas
                .filter(v => estaEnRango(parseFecha(v.fecha), rango))
                .map(v => [v.fecha || "", v.id, v.nom || "", formatImporte(v.pre), v.vin || "suelto"]);
            if (!filas.length) return alert("No hay ventas en el rango indicado.");
            descargarCSV("vrixo-ventas-fiscales.csv", ["fecha", "id", "articulo", "importe", "vinculo_lote"], filas);
        }

        async function exportarBorradosCSV() {
            if (!userUID) return alert("Inicia sesión para exportar.");
            const rango = obtenerRangoFiscal();
            const snap = await getDocs(query(collection(db, "historial_borrados"), where("uid", "==", userUID)));
            const filas = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(x => estaEnRango(parseFecha(x.eliminadoEn), rango))
                .map(x => [
                    x.eliminadoEn || "",
                    x.tipo === "c" ? "COMPRA" : "VENTA",
                    x.originalId || "",
                    x.registro?.nom || "",
                    formatImporte(x.registro?.total ?? x.registro?.pre ?? 0)
                ]);
            if (!filas.length) return alert("No hay borrados en el rango indicado.");
            descargarCSV("vrixo-historial-borrados.csv", ["eliminado_en", "tipo", "id_original", "concepto", "importe"], filas);
        }

        function exportarJSONFiscal() {
            if (!userUID) return alert("Inicia sesión para exportar.");
            const rango = obtenerRangoFiscal();
            const compras = dataLocal.compras.filter(c => estaEnRango(parseFecha(c.fecha), rango));
            const ventas = dataLocal.ventas.filter(v => estaEnRango(parseFecha(v.fecha), rango));
            const payload = {
                version: 1,
                uid: userUID,
                generadoEn: new Date().toISOString(),
                rango: { desde: rango.desdeStr, hasta: rango.hastaStr },
                resumen: {
                    compras: compras.reduce((s, x) => s + (Number(x.total) || 0), 0),
                    ventas: ventas.reduce((s, x) => s + (Number(x.pre) || 0), 0)
                },
                compras,
                ventas
            };
            payload.resumen.neto = payload.resumen.ventas - payload.resumen.compras;
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `vrixo-fiscal-${rango.desdeStr || "inicio"}-${rango.hastaStr || "fin"}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function actualizarUI() {
            const { compras, ventas } = dataLocal;
            const cuerpo = document.getElementById('cuerpo');
            const select = document.getElementById('v-vin');
            cuerpo.innerHTML = "";
            select.innerHTML = '<option value="suelto">Venta Suelta (Sin lote)</option>';
            
            let totalInversion = 0, totalVentas = 0;

            // 1. Mostrar Lotes y sus ventas hijas
            compras.forEach(c => {
                totalInversion += c.total;
                const ventasHijas = ventas.filter(v => v.vin === c.id);
                const recaudado = ventasHijas.reduce((s, x) => s + x.pre, 0);
                const margen = recaudado - c.total;

                // Fila del Lote (Padre)
                cuerpo.innerHTML += `
                    <tr class="row-lote">
                        <td>${c.fecha}</td>
                        <td>📦 LOTE: ${c.nom}</td>
                        <td style="color:red">-${c.total.toFixed(2)}€</td>
                        <td>Total Rec: ${recaudado.toFixed(2)}€</td>
                        <td style="color:${margen >= 0 ? 'green' : 'red'}">${margen >= 0 ? 'Beneficio' : 'Pendiente'}: ${margen.toFixed(2)}€</td>
                        <td><button onclick="borrarReg('c','${c.id}')" style="background:none;color:red;width:auto">✕</button></td>
                    </tr>`;

                // Filas de ventas de ese lote (Hijas)
                ventasHijas.forEach(v => {
                    totalVentas += v.pre;
                    cuerpo.innerHTML += `
                        <tr class="row-venta">
                            <td></td>
                            <td class="indent">└─ 💰 ${v.nom}</td>
                            <td>---</td>
                            <td style="color:green">+${v.pre.toFixed(2)}€</td>
                            <td style="font-size:0.7rem; color:#94a3b8">Venta de lote</td>
                            <td><button onclick="borrarReg('v','${v.id}')" style="background:none;color:red;width:auto">✕</button></td>
                        </tr>`;
                });
                
                select.innerHTML += `<option value="${c.id}">${c.nom}</option>`;
            });

            // 2. Mostrar Ventas Sueltas
            const ventasSueltas = ventas.filter(v => v.vin === 'suelto');
            if(ventasSueltas.length > 0) {
                cuerpo.innerHTML += `<tr style="background:#f1f5f9"><td colspan="6" style="font-size:0.7rem; font-weight:bold; padding:5px 12px">VENTAS SIN LOTE</td></tr>`;
                ventasSueltas.forEach(v => {
                    totalVentas += v.pre;
                    cuerpo.innerHTML += `
                        <tr class="row-venta">
                            <td>${v.fecha}</td>
                            <td>💰 ${v.nom}</td>
                            <td>---</td>
                            <td style="color:green">+${v.pre.toFixed(2)}€</td>
                            <td>Venta Suelta</td>
                            <td><button onclick="borrarReg('v','${v.id}')" style="background:none;color:red;width:auto">✕</button></td>
                        </tr>`;
                });
            }

            // Totales
            document.getElementById('t-gastos').innerText = totalInversion.toFixed(2) + "€";
            document.getElementById('t-ventas').innerText = totalVentas.toFixed(2) + "€";
            const neto = totalVentas - totalInversion;
            document.getElementById('t-neto').innerText = neto.toFixed(2) + "€";
            document.getElementById('t-neto').style.color = neto >= 0 ? "#4ade80" : "#f87171";
            actualizarResumenFiscal();
        }
    </script>
