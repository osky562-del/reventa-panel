<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRIXO | Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --dark2: #1e293b;
            --dark3: #334155;
            --muted: #64748b;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --white: #ffffff;
            --radius: 14px;
            --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.06);
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--dark3); min-height: 100vh; }

        /* ── TOAST ── */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--dark2); color: white; padding: 12px 18px; border-radius: 10px; font-size: 0.875rem; font-weight: 500;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: slideIn .25s ease; min-width: 220px; }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error   { border-left: 4px solid var(--danger); }
        .toast.info    { border-left: 4px solid var(--primary); }
        @keyframes slideIn { from { transform: translateX(120%); opacity:0; } to { transform: translateX(0); opacity:1; } }
        @keyframes fadeOut { to { opacity:0; transform: translateX(120%); } }

        /* ── LOGIN ── */
        #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh;
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%); }
        .login-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); padding: 44px 40px; border-radius: 24px;
            width: 360px; text-align: center; box-shadow: 0 24px 64px rgba(0,0,0,0.4); }
        .login-logo { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; color: white; margin-bottom: 6px; }
        .login-logo span { color: var(--primary); }
        .login-sub { color: #94a3b8; font-size: 0.875rem; margin-bottom: 28px; }
        .login-card input { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
            color: white; padding: 13px 16px; border-radius: 10px; width: 100%; margin-bottom: 12px;
            font-size: 0.95rem; outline: none; transition: border .2s; }
        .login-card input::placeholder { color: #64748b; }
        .login-card input:focus { border-color: var(--primary); }
        .login-card button { width: 100%; padding: 13px; border-radius: 10px; border: none;
            background: var(--primary); color: white; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: background .2s, transform .1s; margin-top: 4px; }
        .login-card button:hover { background: var(--primary-dark); }
        .login-card button:active { transform: scale(0.98); }

        /* ── APP ── */
        #app-content { display: none; }

        /* ── HEADER ── */
        header { background: var(--dark); color: white; padding: 0; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
        .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }
        .brand span { color: var(--primary); }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn-header { display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px;
            border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: white; transition: all .2s; white-space: nowrap; }
        .btn-header:hover { filter: brightness(1.15); }
        .btn-header.slate  { background: #334155; }
        .btn-header.teal   { background: #0d9488; }
        .btn-header.violet { background: #7c3aed; }
        .btn-header.ghost  { background: transparent; color: #94a3b8; text-decoration: underline; font-size: 0.8rem; border: none; cursor: pointer; }

        /* ── STATS BAR ── */
        .stats-bar { background: var(--dark2); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stats-inner { max-width: 1200px; margin: 0 auto; padding: 16px 24px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07);
            padding: 14px 18px; border-radius: 12px; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; margin-bottom: 4px; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: white; }

        /* ── MAIN ── */
        .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

        /* ── FORMS GRID ── */
        .forms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
        .card-title { font-size: 0.95rem; font-weight: 700; color: var(--dark2); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card-title .icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .icon-compra { background: #fef3c7; }
        .icon-venta  { background: #d1fae5; }
        .icon-fiscal { background: #ede9fe; }

        .form-field { margin-bottom: 10px; }
        .form-field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
        .form-field input, .form-field select {
            width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 9px;
            font-size: 0.9rem; color: var(--dark3); background: white; outline: none; transition: border .2s; }
        .form-field input:focus, .form-field select:focus { border-color: var(--primary); }
        .form-field input::placeholder { color: #cbd5e1; }

        .btn { width: 100%; padding: 11px; border-radius: 9px; border: none; cursor: pointer;
            font-weight: 700; font-size: 0.9rem; color: white; transition: all .2s; margin-top: 4px; }
        .btn:active { transform: scale(0.98); }
        .btn-compra { background: linear-gradient(135deg, #1e293b, #334155); }
        .btn-compra:hover { background: linear-gradient(135deg, #334155, #475569); }
        .btn-venta  { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-venta:hover  { background: linear-gradient(135deg, #10b981, #34d399); }

        /* ── FISCAL ── */
        .fiscal-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 12px; }
        .fiscal-row .form-field { margin-bottom: 0; }
        .btn-apply { padding: 10px 16px; border-radius: 9px; border: none; cursor: pointer;
            background: var(--dark3); color: white; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
        .btn-apply:hover { background: var(--dark2); }
        .export-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 10px; }
        .btn-export { padding: 9px 14px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: 600; font-size: 0.8rem; color: white; transition: filter .2s; }
        .btn-export:hover { filter: brightness(1.12); }
        .fiscal-summary { margin-top: 12px; padding: 10px 14px; background: var(--bg); border-radius: 9px;
            font-size: 0.8rem; color: var(--muted); line-height: 1.6; }

        /* ── TABLE ── */
        .table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .table-title { font-size: 0.9rem; font-weight: 700; color: var(--dark2); }
        .table-count { font-size: 0.75rem; color: var(--muted); background: var(--bg); padding: 3px 10px; border-radius: 20px; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #f8fafc; padding: 11px 16px; text-align: left; color: var(--muted);
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
            border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody td { padding: 11px 16px; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #fafafa; }

        .row-lote { background: #fffbeb !important; }
        .row-lote:hover { background: #fef9c3 !important; }
        .row-lote td:first-child { border-left: 3px solid var(--warning); }
        .row-suelta { background: #f0fdf4 !important; }
        .row-suelta:hover { background: #dcfce7 !important; }

        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
        .badge-lote     { background: #fef3c7; color: #92400e; }
        .badge-venta    { background: #d1fae5; color: #065f46; }
        .badge-suelta   { background: #e0f2fe; color: #0369a1; }
        .badge-win      { background: #dcfce7; color: #166534; }
        .badge-loss     { background: #fee2e2; color: #991b1b; }

        .indent-cell { padding-left: 32px !important; color: var(--muted); }
        .amount-neg { color: var(--danger); font-weight: 600; }
        .amount-pos { color: var(--success); font-weight: 600; }

        .btn-del { background: none; border: none; cursor: pointer; color: #cbd5e1; padding: 4px 6px;
            border-radius: 6px; transition: all .15s; font-size: 0.85rem; }
        .btn-del:hover { color: var(--danger); background: #fee2e2; }

        .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
        .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

        .row-lote td.td-toggle { cursor: pointer; user-select: none; }
        .toggle-icon { display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; border-radius: 5px; background: rgba(245,158,11,0.15);
            color: #92400e; font-size: 0.7rem; margin-right: 6px; transition: transform .2s; }
        .toggle-icon.open { transform: rotate(90deg); }
        .row-venta { transition: opacity .15s; }
        .row-venta.hidden { display: none; }

        @media (max-width: 768px) {
            .forms-grid { grid-template-columns: 1fr; }
            .stats-inner { grid-template-columns: 1fr; }
            .fiscal-row { grid-template-columns: 1fr 1fr; }
            .fiscal-row > :last-child { grid-column: 1 / -1; }
            .header-actions .btn-header span { display: none; }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>

<!-- LOGIN -->
<div id="login-screen">
    <div class="login-card">
        <div class="login-logo">VRI<span>XO</span></div>
        <div class="login-sub">Panel de control de proyectos</div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Contraseña">
        <button id="btn-entrar">Entrar →</button>
    </div>
</div>

<!-- APP -->
<div id="app-content">

    <header>
        <div class="header-inner">
            <div class="brand">VRI<span>XO</span></div>
            <div class="header-actions">
                <button class="btn-header slate" onclick="location.reload()">🔄 <span>Refrescar</span></button>
                <button class="btn-header teal" id="btn-backup">💾 <span>Backup</span></button>
                <button class="btn-header violet" id="btn-restaurar">📥 <span>Restaurar</span></button>
                <button class="btn-header ghost" id="btn-salir">Salir</button>
            </div>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stats-inner">
            <div class="stat">
                <div class="stat-label">Inversión total</div>
                <div class="stat-value" id="t-gastos">0.00€</div>
            </div>
            <div class="stat">
                <div class="stat-label">Ventas totales</div>
                <div class="stat-value" id="t-ventas">0.00€</div>
            </div>
            <div class="stat">
                <div class="stat-label">Neto</div>
                <div class="stat-value" id="t-neto">0.00€</div>
            </div>
        </div>
    </div>

    <div class="main">

        <!-- FORMULARIOS -->
        <div class="forms-grid">
            <div class="card">
                <div class="card-title"><span class="icon icon-compra">📦</span> Registrar Compra</div>
                <div class="form-field"><label>Nombre del lote</label><input type="text" id="g-nom" placeholder="Ej: Lote zapatillas junio"></div>
                <div class="form-field"><label>Precio compra (€)</label><input type="number" id="g-pre" placeholder="0.00" step="0.01"></div>
                <div class="form-field"><label>Gasto envío (€)</label><input type="number" id="g-env" placeholder="0.00" step="0.01"></div>
                <button class="btn btn-compra" id="btn-add-compra">Guardar Lote</button>
            </div>
            <div class="card">
                <div class="card-title"><span class="icon icon-venta">💰</span> Registrar Venta</div>
                <div class="form-field"><label>Artículo vendido</label><input type="text" id="v-nom" placeholder="Ej: Nike Air Max talla 42"></div>
                <div class="form-field"><label>Precio venta (€)</label><input type="number" id="v-pre" placeholder="0.00" step="0.01"></div>
                <div class="form-field"><label>Vincular a lote</label><select id="v-vin"><option value="suelto">Venta suelta (sin lote)</option></select></div>
                <button class="btn btn-venta" id="btn-add-venta">Guardar Venta</button>
            </div>
        </div>

        <!-- FISCAL -->
        <div class="card" style="margin-bottom:24px;">
            <div class="card-title"><span class="icon icon-fiscal">🧾</span> Exportación Fiscal</div>
            <div class="fiscal-row">
                <div class="form-field"><label>Desde</label><input type="date" id="f-desde"></div>
                <div class="form-field"><label>Hasta</label><input type="date" id="f-hasta"></div>
                <button class="btn-apply" id="btn-aplicar-filtro">Aplicar rango</button>
            </div>
            <div class="export-btns">
                <button class="btn-export" id="btn-exp-mov"     style="background:#0d9488;">📊 Movimientos CSV</button>
                <button class="btn-export" id="btn-exp-compras" style="background:#1d4ed8;">📦 Compras CSV</button>
                <button class="btn-export" id="btn-exp-ventas"  style="background:#059669;">💰 Ventas CSV</button>
                <button class="btn-export" id="btn-exp-borrados" style="background:#9f1239;">🗑 Borrados CSV</button>
                <button class="btn-export" id="btn-exp-json"    style="background:#6d28d9;">📁 JSON Fiscal</button>
                <button class="btn-export" id="btn-exp-pdf"     style="background:#b91c1c;">📄 Informe PDF</button>
            </div>
            <div id="fiscal-info" class="fiscal-summary">Sin datos para exportar.</div>
        </div>

        <!-- TABLA -->
        <div class="table-wrap">
            <div class="table-header">
                <div class="table-title">Movimientos</div>
                <div class="table-count" id="row-count">0 registros</div>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Concepto</th>
                            <th>Tipo</th>
                            <th>Coste</th>
                            <th>Venta</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo"></tbody>
                </table>
            </div>
        </div>

        <div style="height:60px"></div>
    </div>
</div>

<input id="backup-file" type="file" accept="application/json" style="display:none">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBphY_jaOOOVOzwzfoXE78_iDVOQYRhA2o",
        authDomain: "control-de-gastos-39154.firebaseapp.com",
        projectId: "control-de-gastos-39154",
        storageBucket: "control-de-gastos-39154.firebasestorage.app",
        messagingSenderId: "845236944662",
        appId: "1:845236944662:web:897201644eaf708afd5a37"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let userUID = null;
    let dataLocal = { compras: [], ventas: [] };
    let stopCompras = null;
    let stopVentas = null;

    // ── TOAST ──
    function toast(msg, type = 'info') {
        const icons = { success: '✅', error: '❌', info: 'ℹ️' };
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => {
            el.style.animation = 'fadeOut .3s ease forwards';
            setTimeout(() => el.remove(), 300);
        }, 3000);
    }

    // ── AUTH ──
    document.getElementById('btn-entrar').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass).catch(e => toast("Error: " + e.message, 'error'));
    });
    document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('pass').focus(); });
    document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-entrar').click(); });

    document.getElementById('btn-salir').addEventListener('click', () => signOut(auth));
    document.getElementById('btn-backup').addEventListener('click', descargarBackup);
    document.getElementById('btn-restaurar').addEventListener('click', () => document.getElementById('backup-file').click());
    document.getElementById('btn-aplicar-filtro').addEventListener('click', actualizarResumenFiscal);
    document.getElementById('btn-exp-pdf').addEventListener('click', exportarPDF);
    document.getElementById('f-desde').addEventListener('change', actualizarResumenFiscal);
    document.getElementById('f-hasta').addEventListener('change', actualizarResumenFiscal);
    document.getElementById('btn-exp-mov').addEventListener('click', exportarMovimientosCSV);
    document.getElementById('btn-exp-compras').addEventListener('click', exportarComprasCSV);
    document.getElementById('btn-exp-ventas').addEventListener('click', exportarVentasCSV);
    document.getElementById('btn-exp-json').addEventListener('click', exportarJSONFiscal);
    document.getElementById('btn-exp-borrados').addEventListener('click', exportarBorradosCSV);
    document.getElementById('backup-file').addEventListener('change', async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        await restaurarBackup(file);
        event.target.value = "";
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            userUID = user.uid;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            iniciarSincro();
        } else {
            if (stopCompras) stopCompras();
            if (stopVentas) stopVentas();
            stopCompras = stopVentas = null;
            userUID = null;
            dataLocal = { compras: [], ventas: [] };
            rangoInicializado = false;
            document.getElementById('f-desde').value = '';
            document.getElementById('f-hasta').value = '';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    function iniciarSincro() {
        if (stopCompras) stopCompras();
        if (stopVentas) stopVentas();
        stopCompras = onSnapshot(query(collection(db, "compras"), where("uid", "==", userUID)), (s) => {
            dataLocal.compras = s.docs.map(d => ({ id: d.id, ...d.data() }));
            actualizarUI();
        });
        stopVentas = onSnapshot(query(collection(db, "ventas"), where("uid", "==", userUID)), (s) => {
            dataLocal.ventas = s.docs.map(d => ({ id: d.id, ...d.data() }));
            actualizarUI();
        });
    }

    document.getElementById('btn-add-compra').addEventListener('click', async () => {
        const nom = document.getElementById('g-nom').value.trim();
        const total = (parseFloat(document.getElementById('g-pre').value) || 0) + (parseFloat(document.getElementById('g-env').value) || 0);
        if (!nom || total <= 0) return toast("Rellena el nombre y el precio.", 'error');
        await addDoc(collection(db, "compras"), { uid: userUID, nom, total, fecha: new Date().toLocaleDateString() });
        document.getElementById('g-nom').value = "";
        document.getElementById('g-pre').value = "";
        document.getElementById('g-env').value = "";
        toast("Lote guardado correctamente.", 'success');
    });

    document.getElementById('btn-add-venta').addEventListener('click', async () => {
        const nom = document.getElementById('v-nom').value.trim();
        const pre = parseFloat(document.getElementById('v-pre').value) || 0;
        const vin = document.getElementById('v-vin').value;
        if (!nom || pre <= 0) return toast("Rellena el artículo y el precio.", 'error');
        await addDoc(collection(db, "ventas"), { uid: userUID, nom, pre, vin, fecha: new Date().toLocaleDateString() });
        document.getElementById('v-nom').value = "";
        document.getElementById('v-pre').value = "";
        toast("Venta guardada correctamente.", 'success');
    });

    window.borrarReg = async (tipo, id) => {
        if (!confirm("¿Eliminar permanentemente?")) return;
        const origen = tipo === 'c' ? dataLocal.compras : dataLocal.ventas;
        const registro = origen.find(item => item.id === id);
        if (registro) {
            await addDoc(collection(db, "historial_borrados"), {
                uid: userUID, tipo, originalId: id, registro,
                eliminadoEn: new Date().toISOString()
            });
        }
        await deleteDoc(doc(db, tipo === 'c' ? "compras" : "ventas", id));
        toast("Registro eliminado.", 'info');
    };

    function descargarBackup() {
        if (!userUID) return toast("Inicia sesión para exportar.", 'error');
        const payload = { version: 1, uid: userUID, fechaExportacion: new Date().toISOString(), compras: dataLocal.compras, ventas: dataLocal.ventas };
        descargarBlob(JSON.stringify(payload, null, 2), `vrixo-backup-${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.json`, "application/json");
        toast("Backup descargado.", 'success');
    }

    async function restaurarBackup(file) {
        if (!userUID) return toast("Inicia sesión para restaurar.", 'error');
        let contenido;
        try { contenido = JSON.parse(await file.text()); }
        catch { return toast("El archivo no es un JSON válido.", 'error'); }
        const comprasBackup = Array.isArray(contenido.compras) ? contenido.compras : [];
        const ventasBackup  = Array.isArray(contenido.ventas)  ? contenido.ventas  : [];
        if (!comprasBackup.length && !ventasBackup.length) return toast("El backup no contiene datos.", 'error');

        const [snapC, snapV] = await Promise.all([
            getDocs(query(collection(db, "compras"), where("uid", "==", userUID))),
            getDocs(query(collection(db, "ventas"),  where("uid", "==", userUID)))
        ]);
        const existC = new Set(snapC.docs.map(d => d.id));
        const existV = new Set(snapV.docs.map(d => d.id));

        let batch = writeBatch(db), ops = 0, ci = 0, vi = 0;
        const flush = async () => { if (ops) { await batch.commit(); batch = writeBatch(db); ops = 0; } };

        for (const c of comprasBackup) {
            if (!c?.id || existC.has(c.id)) continue;
            batch.set(doc(db, "compras", c.id), { uid: userUID, nom: c.nom||"Lote importado", total: Number(c.total)||0, fecha: c.fecha||new Date().toLocaleDateString() }, { merge: true });
            existC.add(c.id); ci++; ops++;
            if (ops >= 400) await flush();
        }
        for (const v of ventasBackup) {
            if (!v?.id || existV.has(v.id)) continue;
            batch.set(doc(db, "ventas", v.id), { uid: userUID, nom: v.nom||"Venta importada", pre: Number(v.pre)||0, vin: v.vin||"suelto", fecha: v.fecha||new Date().toLocaleDateString() }, { merge: true });
            existV.add(v.id); vi++; ops++;
            if (ops >= 400) await flush();
        }
        await flush();
        toast(`Restaurado: ${ci} compras, ${vi} ventas.`, 'success');
    }

    // ── FISCAL ──
    function parseFecha(v) {
        if (!v) return null;
        if (v instanceof Date && !isNaN(v)) return v;
        if (typeof v !== "string") return null;
        const iso = new Date(v);
        if (!isNaN(iso) && v.includes("-")) return iso;
        if (v.includes("/")) {
            const [d,m,y] = v.split("/");
            const p = new Date(+y, +m-1, +d);
            if (!isNaN(p)) return p;
        }
        return null;
    }
    function toInputDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    let rangoInicializado = false;
    function inicializarRangoSiVacio() {
        // Solo auto-rellena si ambos campos están vacíos (primera vez)
        const elD = document.getElementById('f-desde'), elH = document.getElementById('f-hasta');
        if (rangoInicializado || (elD.value && elH.value)) { rangoInicializado = true; return; }
        const fechas = [...dataLocal.compras, ...dataLocal.ventas].map(x => parseFecha(x.fecha)).filter(Boolean).sort((a,b)=>a-b);
        const hoy = new Date();
        elD.value = fechas.length ? toInputDate(fechas[0]) : toInputDate(new Date(hoy.getFullYear(),0,1));
        elH.value = fechas.length ? toInputDate(fechas[fechas.length-1]) : toInputDate(hoy);
        rangoInicializado = true;
    }
    function getRango() {
        // Lee directamente los inputs, sin tocar su valor
        const ds = document.getElementById('f-desde').value, hs = document.getElementById('f-hasta').value;
        return { desde: ds ? new Date(`${ds}T00:00:00`) : null, hasta: hs ? new Date(`${hs}T23:59:59`) : null, desdeStr: ds, hastaStr: hs };
    }
    function inRango(fecha, r) {
        if (!fecha) return false;
        if (r.desde && fecha < r.desde) return false;
        if (r.hasta && fecha > r.hasta) return false;
        return true;
    }
    function fmt(v) { return (Number(v)||0).toFixed(2); }
    function escCSV(v) { const s = String(v??""); return (s.includes('"')||s.includes(';')||s.includes('\n')) ? `"${s.replace(/"/g,'""')}"` : s; }
    function descargarCSV(nombre, cols, filas) {
        const txt = [cols.map(escCSV).join(";"), ...filas.map(f=>f.map(escCSV).join(";"))].join("\n");
        descargarBlob("\uFEFF"+txt, nombre, "text/csv;charset=utf-8;");
    }
    function descargarBlob(contenido, nombre, tipo) {
        const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
        const a = Object.assign(document.createElement("a"), { href: url, download: nombre });
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }
    function getMovsFiltrados(r) {
        if (!r) r = getRango();
        return [
            ...dataLocal.compras.map(c => ({ fecha:c.fecha||"", fechaObj:parseFecha(c.fecha), tipo:"COMPRA", concepto:c.nom||"", id:c.id, vinculo:"", importe:-Math.abs(Number(c.total)||0) })),
            ...dataLocal.ventas.map(v  => ({ fecha:v.fecha||"",  fechaObj:parseFecha(v.fecha),  tipo:"VENTA",  concepto:v.nom||"", id:v.id, vinculo:v.vin||"suelto", importe:Math.abs(Number(v.pre)||0) }))
        ].filter(m => inRango(m.fechaObj, r)).sort((a,b) => (a.fechaObj?.getTime()||0)-(b.fechaObj?.getTime()||0));
    }
    function actualizarResumenFiscal() {
        const r = getRango();
        const sinRango = !r.desdeStr && !r.hastaStr;
        if (sinRango) { document.getElementById('fiscal-info').innerHTML = 'Sin rango definido. Selecciona fechas.'; return; }
        const movs = getMovsFiltrados(r);
        const tc = movs.filter(m=>m.tipo==="COMPRA").reduce((s,x)=>s+Math.abs(x.importe),0);
        const tv = movs.filter(m=>m.tipo==="VENTA").reduce((s,x)=>s+x.importe,0);
        const neto = tv - tc;
        document.getElementById('fiscal-info').innerHTML =
            `Rango <strong>${r.desdeStr||"-"}</strong> → <strong>${r.hastaStr||"-"}</strong> &nbsp;·&nbsp; `+
            `<strong>${movs.length}</strong> registros &nbsp;·&nbsp; `+
            `Compras <strong>${fmt(tc)}€</strong> &nbsp;·&nbsp; `+
            `Ventas <strong>${fmt(tv)}€</strong> &nbsp;·&nbsp; `+
            `Neto <strong style="color:${neto>=0?'#10b981':'#ef4444'};font-size:1rem">${neto>=0?'+':''}${fmt(neto)}€</strong>`;
    }
    function exportarMovimientosCSV() {
        if (!userUID) return toast("Inicia sesión.", 'error');
        const filas = getMovsFiltrados().map(m=>[m.fecha,m.tipo,m.concepto,m.id,m.vinculo,fmt(m.importe)]);
        if (!filas.length) return toast("No hay movimientos en ese rango.", 'error');
        descargarCSV("vrixo-movimientos.csv", ["fecha","tipo","concepto","id","vinculo","importe"], filas);
        toast("CSV descargado.", 'success');
    }
    function exportarComprasCSV() {
        if (!userUID) return toast("Inicia sesión.", 'error');
        const r = getRango();
        const filas = dataLocal.compras.filter(c=>inRango(parseFecha(c.fecha),r)).map(c => {
            const rec = dataLocal.ventas.filter(v=>v.vin===c.id).reduce((s,x)=>s+(Number(x.pre)||0),0);
            return [c.fecha||"",c.id,c.nom||"",fmt(c.total),fmt(rec),fmt(rec-c.total)];
        });
        if (!filas.length) return toast("No hay compras en ese rango.", 'error');
        descargarCSV("vrixo-compras.csv", ["fecha","id","lote","coste","recaudado","margen"], filas);
        toast("CSV descargado.", 'success');
    }
    function exportarVentasCSV() {
        if (!userUID) return toast("Inicia sesión.", 'error');
        const r = getRango();
        const filas = dataLocal.ventas.filter(v=>inRango(parseFecha(v.fecha),r)).map(v=>[v.fecha||"",v.id,v.nom||"",fmt(v.pre),v.vin||"suelto"]);
        if (!filas.length) return toast("No hay ventas en ese rango.", 'error');
        descargarCSV("vrixo-ventas.csv", ["fecha","id","articulo","importe","vinculo_lote"], filas);
        toast("CSV descargado.", 'success');
    }
    async function exportarBorradosCSV() {
        if (!userUID) return toast("Inicia sesión.", 'error');
        const r = getRango();
        const snap = await getDocs(query(collection(db, "historial_borrados"), where("uid","==",userUID)));
        const filas = snap.docs.map(d=>({id:d.id,...d.data()}))
            .filter(x=>inRango(parseFecha(x.eliminadoEn),r))
            .map(x=>[x.eliminadoEn||"",x.tipo==="c"?"COMPRA":"VENTA",x.originalId||"",x.registro?.nom||"",fmt(x.registro?.total??x.registro?.pre??0)]);
        if (!filas.length) return toast("No hay borrados en ese rango.", 'error');
        descargarCSV("vrixo-borrados.csv", ["eliminado_en","tipo","id_original","concepto","importe"], filas);
        toast("CSV descargado.", 'success');
    }
    function exportarPDF() {
        if (!userUID) return toast("Inicia sesión.", 'error');
        const r = getRango();
        const movs = getMovsFiltrados(r);
        if (!movs.length) return toast("No hay datos en ese rango.", 'error');
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        // Cabecera
        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, 210, 28, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(20);
        doc.text('VRIXO', 14, 12);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(148, 163, 184);
        doc.text('Informe Fiscal', 14, 19);
        doc.setTextColor(255, 255, 255);
        doc.text(`Generado: ${new Date().toLocaleString('es-ES')}`, 196, 19, { align: 'right' });

        // Rango
        doc.setTextColor(100, 116, 139);
        doc.setFontSize(8);
        doc.text(`Período: ${r.desdeStr || '-'} → ${r.hastaStr || '-'}`, 14, 36);

        // Resumen
        const tc = movs.filter(m=>m.tipo==="COMPRA").reduce((s,x)=>s+Math.abs(x.importe),0);
        const tv = movs.filter(m=>m.tipo==="VENTA").reduce((s,x)=>s+x.importe,0);
        const neto = tv - tc;

        const stats = [
            { label: 'Inversión', valor: `${fmt(tc)} €`, color: [239,68,68] },
            { label: 'Ventas',    valor: `${fmt(tv)} €`, color: [16,185,129] },
            { label: 'Neto',      valor: `${neto>=0?'+':''}${fmt(neto)} €`, color: neto>=0?[16,185,129]:[239,68,68] }
        ];
        let sx = 14;
        stats.forEach(s => {
            doc.setFillColor(248, 250, 252);
            doc.roundedRect(sx, 40, 58, 20, 3, 3, 'F');
            doc.setTextColor(100, 116, 139);
            doc.setFontSize(7);
            doc.setFont('helvetica', 'normal');
            doc.text(s.label.toUpperCase(), sx+4, 48);
            doc.setTextColor(...s.color);
            doc.setFontSize(13);
            doc.setFont('helvetica', 'bold');
            doc.text(s.valor, sx+4, 56);
            sx += 64;
        });

        // Tabla de compras con sus ventas
        const comprasFiltradas = dataLocal.compras.filter(c => inRango(parseFecha(c.fecha), r));
        if (comprasFiltradas.length) {
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.setTextColor(30, 41, 59);
            doc.text('Lotes y ventas vinculadas', 14, 72);
            const bodyLotes = [];
            comprasFiltradas.forEach(c => {
                const hijas = dataLocal.ventas.filter(v => v.vin === c.id);
                const rec = hijas.reduce((s,x)=>s+(Number(x.pre)||0), 0);
                const margen = rec - c.total;
                bodyLotes.push([
                    { content: `📦 ${c.nom}`, styles: { fontStyle:'bold', fillColor:[255,251,235], textColor:[146,64,14] } },
                    { content: c.fecha||'', styles: { fillColor:[255,251,235] } },
                    { content: `-${fmt(c.total)}€`, styles: { textColor:[220,38,38], fontStyle:'bold', fillColor:[255,251,235] } },
                    { content: `${fmt(rec)}€`, styles: { fillColor:[255,251,235] } },
                    { content: `${margen>=0?'+':''}${fmt(margen)}€`, styles: { textColor: margen>=0?[22,101,52]:[185,28,28], fontStyle:'bold', fillColor:[255,251,235] } }
                ]);
                hijas.forEach(v => bodyLotes.push([
                    { content: `  └ ${v.nom}`, styles: { textColor:[71,85,105] } },
                    v.fecha||'', '',
                    { content: `+${fmt(v.pre)}€`, styles: { textColor:[5,150,105] } },
                    ''
                ]));
            });
            doc.autoTable({
                startY: 75,
                head: [['Concepto','Fecha','Coste','Recaudado','Margen']],
                body: bodyLotes,
                styles: { fontSize: 8, cellPadding: 3 },
                headStyles: { fillColor:[30,41,59], textColor:255, fontStyle:'bold', fontSize:7 },
                columnStyles: { 0:{cellWidth:70}, 1:{cellWidth:22}, 2:{cellWidth:25}, 3:{cellWidth:25}, 4:{cellWidth:25} },
                margin: { left:14, right:14 }
            });
        }

        // Ventas sueltas
        const sueltas = dataLocal.ventas.filter(v => v.vin==='suelto' && inRango(parseFecha(v.fecha), r));
        if (sueltas.length) {
            const y = doc.lastAutoTable ? doc.lastAutoTable.finalY + 8 : 72;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.setTextColor(30, 41, 59);
            doc.text('Ventas sueltas', 14, y);
            doc.autoTable({
                startY: y + 3,
                head: [['Artículo','Fecha','Importe']],
                body: sueltas.map(v => [v.nom||'', v.fecha||'', { content:`+${fmt(v.pre)}€`, styles:{textColor:[5,150,105], fontStyle:'bold'} }]),
                styles: { fontSize: 8, cellPadding: 3 },
                headStyles: { fillColor:[30,41,59], textColor:255, fontStyle:'bold', fontSize:7 },
                margin: { left:14, right:14 }
            });
        }

        // Pie
        const pageH = doc.internal.pageSize.height;
        doc.setFillColor(248, 250, 252);
        doc.rect(0, pageH-12, 210, 12, 'F');
        doc.setTextColor(148, 163, 184);
        doc.setFontSize(7);
        doc.setFont('helvetica', 'normal');
        doc.text('Generado por VRIXO · Documento no vinculante', 14, pageH-4);
        doc.text(`Pág. 1`, 196, pageH-4, { align:'right' });

        doc.save(`vrixo-informe-${r.desdeStr||'inicio'}-${r.hastaStr||'fin'}.pdf`);
        toast("PDF descargado.", 'success');
    }
    function exportarJSONFiscal() {
        if (!userUID) return toast("Inicia sesión.", 'error');
        const r = getRango();
        const compras = dataLocal.compras.filter(c=>inRango(parseFecha(c.fecha),r));
        const ventas  = dataLocal.ventas.filter(v=>inRango(parseFecha(v.fecha),r));
        const res = { compras: compras.reduce((s,x)=>s+(Number(x.total)||0),0), ventas: ventas.reduce((s,x)=>s+(Number(x.pre)||0),0) };
        const payload = { version:1, uid:userUID, generadoEn:new Date().toISOString(), rango:{desde:r.desdeStr,hasta:r.hastaStr}, resumen:{...res,neto:res.ventas-res.compras}, compras, ventas };
        descargarBlob(JSON.stringify(payload,null,2), `vrixo-fiscal-${r.desdeStr||"inicio"}-${r.hastaStr||"fin"}.json`, "application/json");
        toast("JSON descargado.", 'success');
    }

    // ── UI ──
    function sortByFecha(arr) {
        return [...arr].sort((a, b) => {
            const fa = parseFecha(a.fecha), fb = parseFecha(b.fecha);
            if (!fa && !fb) return 0;
            if (!fa) return 1;
            if (!fb) return -1;
            return fb - fa; // más reciente primero
        });
    }

    window.toggleLote = (id) => {
        const icon = document.querySelector(`.toggle-icon[data-id="${id}"]`);
        const filas = document.querySelectorAll(`.venta-hijo[data-lote="${id}"]`);
        const abierto = icon.classList.contains('open');
        icon.classList.toggle('open', !abierto);
        filas.forEach(f => f.classList.toggle('hidden', abierto));
    };

    function actualizarUI() {
        const { compras, ventas } = dataLocal;
        const cuerpo = document.getElementById('cuerpo');
        const select = document.getElementById('v-vin');
        cuerpo.innerHTML = "";
        select.innerHTML = '<option value="suelto">Venta suelta (sin lote)</option>';

        let totalInv = 0, totalVen = 0, rowCount = 0;

        // Ordenar lotes por fecha (más reciente primero)
        const comprasOrdenadas = sortByFecha(compras);

        comprasOrdenadas.forEach(c => {
            totalInv += c.total;
            const hijas = sortByFecha(ventas.filter(v => v.vin === c.id));
            const rec = hijas.reduce((s,x) => s + x.pre, 0);
            const margen = rec - c.total;
            rowCount++;
            const tieneHijas = hijas.length > 0;

            cuerpo.innerHTML += `
                <tr class="row-lote">
                    <td>${c.fecha||'—'}</td>
                    <td class="td-toggle" onclick="${tieneHijas ? `toggleLote('${c.id}')` : ''}">
                        ${tieneHijas ? `<span class="toggle-icon open" data-id="${c.id}">▶</span>` : '<span style="display:inline-block;width:26px"></span>'}
                        <strong>📦 ${c.nom}</strong>
                        ${tieneHijas ? `<span style="margin-left:6px;font-size:0.72rem;color:#92400e;font-weight:600">${hijas.length} venta${hijas.length>1?'s':''}</span>` : ''}
                    </td>
                    <td><span class="badge badge-lote">Lote</span></td>
                    <td class="amount-neg">−${c.total.toFixed(2)}€</td>
                    <td style="color:#64748b">${rec.toFixed(2)}€ rec.</td>
                    <td><span class="badge ${margen >= 0 ? 'badge-win' : 'badge-loss'}">${margen >= 0 ? '▲' : '▼'} ${margen.toFixed(2)}€</span></td>
                    <td><button class="btn-del" onclick="borrarReg('c','${c.id}')">✕</button></td>
                </tr>`;

            hijas.forEach(v => {
                totalVen += v.pre;
                rowCount++;
                cuerpo.innerHTML += `
                    <tr class="row-venta venta-hijo" data-lote="${c.id}">
                        <td style="color:#94a3b8;font-size:0.8rem">${v.fecha||'—'}</td>
                        <td class="indent-cell">└ 💰 ${v.nom}</td>
                        <td><span class="badge badge-venta">Venta</span></td>
                        <td style="color:#94a3b8">—</td>
                        <td class="amount-pos">+${v.pre.toFixed(2)}€</td>
                        <td style="color:#94a3b8;font-size:0.75rem">Del lote</td>
                        <td><button class="btn-del" onclick="borrarReg('v','${v.id}')">✕</button></td>
                    </tr>`;
            });

            select.innerHTML += `<option value="${c.id}">📦 ${c.nom}</option>`;
        });

        const sueltas = sortByFecha(ventas.filter(v => v.vin === 'suelto'));
        if (sueltas.length) {
            cuerpo.innerHTML += `<tr><td colspan="7" style="padding:6px 16px;background:#f8fafc;font-size:0.7rem;font-weight:700;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;">Ventas sin lote</td></tr>`;
            sueltas.forEach(v => {
                totalVen += v.pre;
                rowCount++;
                cuerpo.innerHTML += `
                    <tr class="row-suelta">
                        <td>${v.fecha||'—'}</td>
                        <td>💰 ${v.nom}</td>
                        <td><span class="badge badge-suelta">Suelta</span></td>
                        <td style="color:#94a3b8">—</td>
                        <td class="amount-pos">+${v.pre.toFixed(2)}€</td>
                        <td style="color:#94a3b8;font-size:0.75rem">Sin lote</td>
                        <td><button class="btn-del" onclick="borrarReg('v','${v.id}')">✕</button></td>
                    </tr>`;
            });
        }

        if (rowCount === 0) {
            cuerpo.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📭</div><div>Sin registros todavía</div></div></td></tr>`;
        }

        document.getElementById('row-count').textContent = `${rowCount} registros`;
        document.getElementById('t-gastos').textContent = totalInv.toFixed(2) + "€";
        document.getElementById('t-ventas').textContent = totalVen.toFixed(2) + "€";
        const neto = totalVen - totalInv;
        const elNeto = document.getElementById('t-neto');
        elNeto.textContent = neto.toFixed(2) + "€";
        elNeto.style.color = neto >= 0 ? "#4ade80" : "#f87171";
        // Inicializa el rango la primera vez (sin sobreescribir si el usuario ya eligió fechas)
        inicializarRangoSiVacio();
        actualizarResumenFiscal();
    }
</script>
